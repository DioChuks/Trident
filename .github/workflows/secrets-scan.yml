name: Secrets Scan

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan every commit on a PR, not just
          # the tip. Without this, a secret committed and then "removed" in a
          # later commit would slip through on a squash-and-merge workflow.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          config-path: .gitleaks.toml
