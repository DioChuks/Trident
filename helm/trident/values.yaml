# Default values for the Trident Helm chart.
# Sensitive environment variables (DATABASE_URL, REDIS_URL, API keys) must be
# placed in a Kubernetes Secret referenced by global.existingSecret — raw
# values should never appear in values.yaml or be committed to version control.

global:
  # Name of a pre-existing Secret that holds sensitive env vars.
  # Required keys: DATABASE_URL, REDIS_URL, ADMIN_API_KEY
  #
  # This name is also the *target* Secret when externalSecret.enabled is
  # true below — the operator writes/syncs into a Secret with this same
  # name, so every deployment's secretKeyRef keeps working unmodified
  # regardless of which provisioning method populates it.
  existingSecret: trident-secrets
  imagePullPolicy: IfNotPresent
  # Optional: imagePullSecrets for private registries
  imagePullSecrets: []

  # ---------------------------------------------------------------------------
  # Secrets provisioning (issue #305): existingSecret above is always the
  # source every deployment reads from via secretKeyRef. This block is the
  # *external-secrets operator* option for populating that same Secret from
  # a real secrets backend, so no plaintext secret ever needs to be
  # `kubectl create secret`'d by hand. See docs/kubernetes.md#secrets for
  # the CSI Secrets Store alternative (deliberately not templated here —
  # it varies per CSI provider/driver installed on the cluster).
  # ---------------------------------------------------------------------------
  externalSecret:
    enabled: false
    # SecretStore/ClusterSecretStore name already configured to talk to your
    # backend (Vault, AWS Secrets Manager, GCP Secret Manager, etc.) — see
    # https://external-secrets.io/latest/api/secretstore/ for how to create one.
    secretStoreRef:
      name: trident-secret-store
      kind: ClusterSecretStore
    refreshInterval: 1h
    # Maps each key the chart's Secret needs (DATABASE_URL, REDIS_URL,
    # ADMIN_API_KEY) to its path in the backend. Defaults assume a
    # single JSON/KV secret at "trident/prod" with matching keys —
    # override remoteRef.key / .property per backend layout.
    data:
      - secretKey: DATABASE_URL
        remoteRef:
          key: trident/prod
          property: DATABASE_URL
      - secretKey: REDIS_URL
        remoteRef:
          key: trident/prod
          property: REDIS_URL
      - secretKey: ADMIN_API_KEY
        remoteRef:
          key: trident/prod
          property: ADMIN_API_KEY

# ---------------------------------------------------------------------------
# Database migrations (issue #308) — runs as a Helm pre-install/pre-upgrade
# hook Job before any app Deployment rolls out, so the schema is always
# migrated ahead of the app. Backed by `sqlx migrate run` (see
# database/Dockerfile), which tracks applied migrations in the database's
# own _sqlx_migrations table, so re-running it on every upgrade is a safe
# no-op for migrations already applied. Set enabled: false if migrations
# are managed by an external process instead (see docs/kubernetes.md).
# ---------------------------------------------------------------------------
migrations:
  enabled: true
  image:
    repository: ghcr.io/telocel-labs/trident-migrate
    tag: latest
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Matches the `useradd --system --uid 1001` in database/Dockerfile.
  securityContextUid: 1001

# ---------------------------------------------------------------------------
# Indexer — 1 replica (distributed cursor not yet supported)
# ---------------------------------------------------------------------------
indexer:
  image:
    repository: ghcr.io/telocel-labs/trident-indexer
    tag: latest
  replicaCount: 1
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  env:
    # GRPC_ADDR of the Rust gRPC service (in-cluster DNS)
    GRPC_ADDR: "trident-grpc-api:5000"
    # Rows per batched INSERT when a page is committed. The page is always one
    # transaction; this caps statement size, not transaction scope.
    DB_BATCH_SIZE: "1000"
    # Topic patterns pushed into the getEvents RPC filter alongside the contract
    # allowlist. Unset means no topic narrowing. Segment count must match the
    # events you want, e.g. a SEP-41 transfer carries three topics:
    #   INDEX_TOPIC_FILTERS: "transfer/*/*,mint/*/*"
  # Prometheus metrics server (METRICS_PORT, default 9090) doubles as the
  # liveness/readiness signal for this otherwise portless worker.
  metricsPort: 9090
  livenessProbe:
    httpGet:
      path: /metrics
      port: 9090
    initialDelaySeconds: 15
    periodSeconds: 20
    failureThreshold: 3
    timeoutSeconds: 2
  readinessProbe:
    httpGet:
      path: /metrics
      port: 9090
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 2
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Matches the `USER trident` (uid 1001) added to crates/indexer/Dockerfile.
  securityContextUid: 1001

# ---------------------------------------------------------------------------
# Rust gRPC API — 1 replica
# ---------------------------------------------------------------------------
grpcApi:
  image:
    repository: ghcr.io/telocel-labs/trident-grpc-api
    tag: latest
  replicaCount: 1
  service:
    port: 5000
  env:
    # Address the gRPC server binds to. Must match service.port.
    GRPC_ADDR: "0.0.0.0:5000"
    # In-flight event buffer per StreamEvents subscriber. A full buffer blocks
    # that subscriber's Redis consumer — deliberate backpressure, so a slow
    # client throttles itself instead of growing an unbounded server-side queue.
    STREAM_CHANNEL_BUFFER: "128"
  livenessProbe:
    tcpSocket:
      port: 5000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 2
  readinessProbe:
    tcpSocket:
      port: 5000
    initialDelaySeconds: 5
    periodSeconds: 5
    failureThreshold: 3
    timeoutSeconds: 2
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "512Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Matches the `USER trident` (uid 1001) added to crates/api/Dockerfile.
  securityContextUid: 1001

# ---------------------------------------------------------------------------
# Go API — configurable replicas with HPA
# ---------------------------------------------------------------------------
goApi:
  image:
    repository: ghcr.io/telocel-labs/trident-go-api
    tag: latest
  replicaCount: 2
  service:
    port: 3000
  env:
    PORT: "3000"
    GRPC_ADDR: "trident-grpc-api:5000"
  hpa:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  livenessProbe:
    httpGet:
      path: /v1/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 2
  readinessProbe:
    httpGet:
      path: /v1/health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5
    # Stricter than liveness — pod is removed from rotation faster
    failureThreshold: 1
    timeoutSeconds: 2
  # Grace period must be >= the bounded shutdown window in main.go so SIGTERM
  # drains in-flight requests before K8s force-kills the pod (issue #233).
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # Matches the `USER trident` (uid 1001) already set in services/api/Dockerfile.
  securityContextUid: 1001
  # PodDisruptionBudget: keep at least this many Go API pods up through a
  # voluntary disruption (node drain, rollout). Multi-replica by default
  # (values.yaml goApi.replicaCount: 2, HPA up to 10), so a naive drain
  # could otherwise take the whole service down at once.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Spread replicas across nodes so a single node loss/drain doesn't take
  # out a disproportionate share of the Go API. ScheduleAnyway (not a hard
  # requirement) so scheduling still succeeds on small/single-node clusters.
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

# ---------------------------------------------------------------------------
# Nginx — reverse proxy / static gateway
# Set enabled: false to use the Ingress resource instead
# ---------------------------------------------------------------------------
nginx:
  enabled: true
  image:
    repository: nginx
    tag: "1.25-alpine"
  replicaCount: 1
  service:
    type: LoadBalancer
    port: 80
  livenessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 2
  readinessProbe:
    tcpSocket:
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 2
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  nodeSelector: {}
  tolerations: []
  affinity: {}
  # The official nginx:alpine image's built-in `nginx` user/group.
  securityContextUid: 101
  # Only rendered when nginx.replicaCount > 1 — with the default single
  # replica, minAvailable: 1 would forbid any voluntary eviction at all
  # (nothing left to keep "available" during the disruption).
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

# ---------------------------------------------------------------------------
# Ingress — use when nginx.enabled is false and a cluster Ingress controller
# is available (e.g. ingress-nginx, AWS ALB, GCE)
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # cert-manager.io/cluster-issuer: letsencrypt-prod
  host: trident.example.com
  tls: []
    # - secretName: trident-tls
    #   hosts:
    #     - trident.example.com
